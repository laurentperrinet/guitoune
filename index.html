<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Guitoune: a guitar tuner that runs entirely in your browser, with a real-time waterfall display.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<title>Guitoune: Guitar Tuner</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #111;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
  }
  
  /* Fixed positioning to avoid browser UI interference */
  #tunerContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  .stringRow {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #222;
  }
  
  .noteLabel {
    position: absolute;
    right: 0.5rem;
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 6px rgba(0,0,0,0.9);
    pointer-events: none;
    z-index: 2;
  }
  
  /* Start screen: the audio context needs a user gesture (notably on iOS) */
  #startOverlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 1rem;
    box-sizing: border-box;
    background: rgba(17, 17, 17, 0.92);
    text-align: center;
  }

  #startOverlay[hidden] {
    display: none;
  }

  #startButton {
    font: inherit;
    font-size: 1.5rem;
    font-weight: bold;
    padding: 0.8rem 2.5rem;
    border: 0;
    border-radius: 2rem;
    background: #30d158;
    color: #111;
    cursor: pointer;
  }

  #startMessage {
    margin: 0;
    max-width: 30rem;
    color: #ff8800;
  }

  .stringRow::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: #555;
  }
  
  .stringRow:last-child::after {
    display: none;
  }
  
  /* Microphone toggle, floating above the string rows */
  #micButton {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    z-index: 10;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 2px solid #555;
    border-radius: 50%;
    background: rgba(17,17,17,0.75);
    color: #aaa;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  #micButton svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Diagonal slash only shown when the microphone is off */
  #micButton .micSlash { display: block; }
  #micButton.listening .micSlash { display: none; }

  /* Colour set from JS: green (silence) to red (maximum level) */
  #micButton.listening {
    border-color: var(--level-colour, #30d158);
    color: var(--level-colour, #30d158);
  }

  /* On short landscape screens, keep the note labels clear of the button */
  @media (max-height: 500px) {
    .noteLabel { right: 4.5rem; }
  }

  #micButton:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  /* Safe area handling for mobile devices */
  @supports(padding: max(0px)) {
    .stringRow:first-child {
      padding-top: max(12px, env(safe-area-inset-top));
    }
    
    .stringRow:last-child {
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>
<div id="tunerContainer"></div>
<div id="startOverlay">
  <button id="startButton" type="button">Start tuner</button>
  <p id="startMessage" role="alert" aria-live="assertive"></p>
</div>
<button id="micButton" type="button" aria-label="Turn microphone on" aria-pressed="false" title="Microphone">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="9" y="2" width="6" height="12" rx="3"/>
    <path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/>
    <line class="micSlash" x1="3" y1="3" x2="21" y2="21"/>
  </svg>
</button>
<script>
/*============== CONFIG =================*/
const DSP_CONFIG = {
  DISPLAY_CENTS   : 100,
  COLS            : 35,
  ROWS            : 30,
  UPDATE_INTERVAL : 100,
  FFT_SIZE        : 8192,
  HP_CUT          : 50,
  LP_CUT          : 1000,
  BAND_Q          : 0.707,
  RMS_THRESHOLD   : 0.005,
  CORRELATION_MIN : 0.4,
  MIN_FREQ        : 50,
  MAX_FREQ        : 1000,
  IN_TUNE_CENTS   : 10,    // |error| below which a string counts as tuned (matches the orange guides)
  LEVEL_MIN_DB   : -60,   // dBFS mapped to green (silence)
  LEVEL_MAX_DB    : -10    // dBFS mapped to red (maximum)
};

/*============== GUITAR STRINGS =================*/
const STRINGS = [
  {name:'E2', freq: 82.41},
  {name:'A2', freq:110.00},
  {name:'D3', freq:146.83},
  {name:'G3', freq:196.00},
  {name:'B3', freq:246.94},
  {name:'E4', freq:329.63}
];

/*============== UI SETUP =================*/
const container = document.getElementById('tunerContainer');
const canvases = [];
const noteLabels = [];

STRINGS.forEach(s => {
  const row = document.createElement('div');
  row.className = 'stringRow';
  row.innerHTML = `<canvas></canvas><div class="noteLabel">${s.name}</div>`;
  container.appendChild(row);
  canvases.push(row.querySelector('canvas'));
  noteLabels.push(row.querySelector('.noteLabel'));
});

/*============== AUDIO =================*/
let audioCtx, analyser, source, hp, lp;
let stream = null;      // kept so that stop() can release the microphone
let rafId = null;       // kept so that stop() can cancel the render loop
let starting = false;   // guards against double clicks during the permission prompt
let wakeLock = null;    // keeps the screen on while tuning
let timeBuf = null;     // reused for every analysis to avoid allocating 32 kB ten times a second
let pixelRatio = 1;     // canvas pixels per CSS pixel, so that Retina screens stay sharp
let lastUpdate = 0;
let histories = STRINGS.map(() => Array(DSP_CONFIG.ROWS).fill(null));
let lastActiveIdx = -1;

const micButton = document.getElementById('micButton');
const startOverlay = document.getElementById('startOverlay');
const startButton = document.getElementById('startButton');
const startMessage = document.getElementById('startMessage');

let targetLevel = 0;    // 0..1, measured every update interval
let displayLevel = 0;   // 0..1, smoothed every frame (fast attack, slow decay)

// Raw RMS (not windowed) in dBFS, mapped linearly to 0..1
function levelFromBuffer(buf){
  let sumSq = 0;
  for (let i = 0; i < buf.length; i++) sumSq += buf[i] * buf[i];
  const db = 20 * Math.log10(Math.sqrt(sumSq / buf.length) + 1e-9);
  const span = DSP_CONFIG.LEVEL_MAX_DB - DSP_CONFIG.LEVEL_MIN_DB;
  return Math.max(0, Math.min(1, (db - DSP_CONFIG.LEVEL_MIN_DB) / span));
}

function updateMicColour(){
  displayLevel += (targetLevel - displayLevel) * (targetLevel > displayLevel ? 0.5 : 0.1);
  // hue 120 (green) at silence down to 0 (red) at maximum
  micButton.style.setProperty('--level-colour', `hsl(${120 * (1 - displayLevel)},100%,50%)`);
}

function setMicState(on){
  micButton.classList.toggle('listening', on);
  micButton.setAttribute('aria-pressed', String(on));
  micButton.setAttribute('aria-label', on ? 'Turn microphone off' : 'Turn microphone on');
}

/*============== START / STOP =================*/
function describeMicError(e){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return 'This browser cannot access the microphone (a secure https:// page is required).';
  switch (e && e.name){
    case 'NotAllowedError':
    case 'SecurityError':
      return 'Microphone access was denied. Allow it in the browser settings, then try again.';
    case 'NotFoundError':
    case 'OverconstrainedError':
      return 'No microphone was found.';
    case 'NotReadableError':
      return 'The microphone is in use by another application.';
    default:
      return 'Microphone error: ' + (e && e.message ? e.message : e);
  }
}

// The screen wake lock is released by the browser when the page is hidden,
// so it is requested again every time the page becomes visible.
async function requestWakeLock(){
  if (!('wakeLock' in navigator) || wakeLock) return;
  try{
    const lock = await navigator.wakeLock.request('screen');
    // The tuner may have been stopped while the request was pending
    if (!stream){ lock.release().catch(() => {}); return; }
    wakeLock = lock;
    lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
  }catch(e){
    wakeLock = null;  // refused (e.g. low battery): tuning still works
  }
}

function releaseWakeLock(){
  if (wakeLock) wakeLock.release().catch(() => {});
  wakeLock = null;
}

async function startTuner(){
  if (stream || starting) return;
  starting = true;
  try{
    // Echo cancellation, noise suppression and automatic gain are tuned for speech:
    // they attenuate sustained notes and make the level pump, so they are all disabled.
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation : false,
      noiseSuppression : false,
      autoGainControl  : false
    }});
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = DSP_CONFIG.HP_CUT;
    hp.Q.value = DSP_CONFIG.BAND_Q;

    lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = DSP_CONFIG.LP_CUT;
    lp.Q.value = DSP_CONFIG.BAND_Q;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = DSP_CONFIG.FFT_SIZE;
    timeBuf = new Float32Array(analyser.fftSize);

    source = audioCtx.createMediaStreamSource(stream);
    source.connect(hp);
    hp.connect(lp);
    lp.connect(analyser);

    if (audioCtx.state === 'suspended') await audioCtx.resume();

    resizeCanvases();
    setMicState(true);
    startOverlay.hidden = true;
    requestWakeLock();
    rafId = requestAnimationFrame(mainLoop);
  }catch(e){
    // Release the stream if the audio graph failed after permission was granted
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    if (audioCtx) audioCtx.close().catch(() => {});
    audioCtx = analyser = source = hp = lp = null;
    setMicState(false);
    startMessage.textContent = describeMicError(e);
    startButton.textContent = 'Try again';
    startOverlay.hidden = false;
  }finally{
    starting = false;
  }
}

function stopTuner(){
  if (rafId !== null) cancelAnimationFrame(rafId);
  rafId = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  if (audioCtx) audioCtx.close();
  audioCtx = analyser = source = hp = lp = null;
  releaseWakeLock();

  // Clear the waterfalls and labels so that a stale reading is not left on screen
  histories = STRINGS.map(() => Array(DSP_CONFIG.ROWS).fill(null));
  lastActiveIdx = -1;
  STRINGS.forEach((s, idx) => {
    noteLabels[idx].textContent = s.name;
    noteLabels[idx].style.color = '#fff';
  });
  targetLevel = displayLevel = 0;
  micButton.style.removeProperty('--level-colour');
  draw();
  setMicState(false);
}

micButton.addEventListener('click', () => {
  if (stream) stopTuner(); else startTuner();
});
startButton.addEventListener('click', startTuner);

// Save battery and release the microphone indicator while the page is in the background
document.addEventListener('visibilitychange', () => {
  if (!audioCtx) return;
  if (document.hidden){
    audioCtx.suspend();
  }else{
    audioCtx.resume();
    requestWakeLock();
  }
});

// Size each canvas from its on-screen box (padding excluded) in device pixels.
// Changing width/height clears a canvas, so it is redrawn straight away.
function resizeCanvases(){
  pixelRatio = window.devicePixelRatio || 1;
  canvases.forEach(canvas => {
    const box = canvas.getBoundingClientRect();
    canvas.width = Math.round(box.width * pixelRatio);
    canvas.height = Math.round(box.height * pixelRatio);
  });
  draw();
}

// ResizeObserver covers window resizes and orientation changes without arbitrary timeouts
new ResizeObserver(resizeCanvases).observe(container);

/*============== AUTOCORRELATION =================*/
function autoCorrelate(buf, sampleRate) {
  const SIZE = buf.length;

  // Apply a Hanning window
  const windowedBuf = new Float32Array(SIZE);
  for (let i = 0; i < SIZE; i++) {
    const window = 0.5 * (1 - Math.cos(2 * Math.PI * i / SIZE));
    windowedBuf[i] = buf[i] * window;
  }

  // RMS check
  let sumSq = 0;
  for (let i = 0; i < SIZE; i++) sumSq += windowedBuf[i] * windowedBuf[i];
  const rms = Math.sqrt(sumSq / SIZE);
  if (rms < DSP_CONFIG.RMS_THRESHOLD) return null;

  // Search range for guitar frequencies
  const minLag = Math.floor(sampleRate / DSP_CONFIG.MAX_FREQ);
  const maxLag = Math.floor(sampleRate / DSP_CONFIG.MIN_FREQ);

  let bestLag = -1;
  let bestCorr = -1;

  // Enhanced autocorrelation
  for (let lag = minLag; lag <= maxLag; lag++) {
    let num = 0;
    let den1 = 0;
    let den2 = 0;

    for (let i = 0; i < SIZE - lag; i++) {
      num += windowedBuf[i] * windowedBuf[i + lag];
      den1 += windowedBuf[i] * windowedBuf[i];
      den2 += windowedBuf[i + lag] * windowedBuf[i + lag];
    }

    const denom = Math.sqrt(den1 * den2);
    if (denom === 0) continue;

    const corr = num / denom;
    if (corr > bestCorr) {
      bestCorr = corr;
      bestLag = lag;
    }
  }

  if (bestLag === -1 || bestCorr < DSP_CONFIG.CORRELATION_MIN) return null;

  // Parabolic interpolation
  if (bestLag > minLag && bestLag < maxLag) {
    const y1 = autocorrAt(windowedBuf, bestLag - 1);
    const y2 = bestCorr;
    const y3 = autocorrAt(windowedBuf, bestLag + 1);

    const d = (y1 - 2*y2 + y3);
    if (d !== 0) {
      const delta = (y1 - y3) / (2 * d);
      if (Math.abs(delta) < 1) bestLag += delta;
    }
  }

  return {
    freq: sampleRate / bestLag,
    correlation: bestCorr,
    rms: rms
  };
}

function autocorrAt(buf, lag) {
  let num = 0, den1 = 0, den2 = 0;
  for (let i = 0; i < buf.length - lag; i++) {
    num += buf[i] * buf[i + lag];
    den1 += buf[i] * buf[i];
    den2 += buf[i + lag] * buf[i + lag];
  }
  const denom = Math.sqrt(den1 * den2);
  return denom === 0 ? 0 : num / denom;
}

/*============== HELPERS =================*/
function hueFromCents(c){
  const max = DSP_CONFIG.DISPLAY_CENTS;
  const lim = Math.max(-max, Math.min(max, c));
  return lim < 0 ? 120 * (1 + lim/max) : 120 + 120 * (lim/max);
}

function centsToCol(cents){
  const step = (2*DSP_CONFIG.DISPLAY_CENTS) / (DSP_CONFIG.COLS-1);
  let col = Math.round((cents + DSP_CONFIG.DISPLAY_CENTS) / step);
  return Math.max(0, Math.min(DSP_CONFIG.COLS-1, col));
}

function centsToX(cents, canvas){
  const half = canvas.width/2;
  const pxPerCent = half / DSP_CONFIG.DISPLAY_CENTS;
  return Math.max(0, Math.min(canvas.width-1, Math.round(half + cents*pxPerCent)));
}

function noteNameFromFreq(freq){
  const noteNames = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const midi = Math.round(69 + 12 * Math.log2(freq/440));
  const noteIndex = (midi % 12 + 12) % 12;
  const octave = Math.floor(midi / 12) - 1;
  return noteNames[noteIndex] + octave;
}

/*============== MAIN LOOP =================*/
function mainLoop(timestamp){
  // The waterfall only changes at each analysis, so the canvases are only redrawn then
  let updated = false;
  if (timestamp - lastUpdate >= DSP_CONFIG.UPDATE_INTERVAL){
    const buf = timeBuf;
    analyser.getFloatTimeDomainData(buf);

    targetLevel = levelFromBuffer(buf);
    const detection = autoCorrelate(buf, audioCtx.sampleRate);

    // Find closest string
    let activeIdx = -1;
    let minCents = Infinity;
    const centsArray = [];

    if (detection) {
      STRINGS.forEach((s, i) => {
        const cents = 1200 * Math.log2(detection.freq / s.freq);
        centsArray[i] = cents;
        const absCents = Math.abs(cents);
        if (absCents < minCents) {
          minCents = absCents;
          activeIdx = i;
        }
      });

      if (minCents > DSP_CONFIG.DISPLAY_CENTS) activeIdx = -1;
    }

    lastActiveIdx = activeIdx;

    // Update labels: green only when the string is actually in tune, orange when merely identified
    STRINGS.forEach((s, idx) => {
      if (idx === activeIdx && detection) {
        noteLabels[idx].textContent = noteNameFromFreq(detection.freq);
        noteLabels[idx].style.color =
          Math.abs(centsArray[idx]) <= DSP_CONFIG.IN_TUNE_CENTS ? '#0f0' : '#ff8800';
      } else {
        noteLabels[idx].textContent = s.name;
        noteLabels[idx].style.color = '#fff';
      }
    });

    // Update history
    STRINGS.forEach((s, idx) => {
      let entry = null;
      if (detection) {
        const cents = centsArray[idx];
        const col = centsToCol(cents);
        const hue = hueFromCents(cents);
        const corr = detection.correlation;
        const light = 10 + 80 * corr;
        const alpha = activeIdx === idx ? corr : corr * 0.5;
        entry = {col, hue, light, alpha};
      }
      histories[idx].push(entry);
      if (histories[idx].length > DSP_CONFIG.ROWS) histories[idx].shift();
    });

    lastUpdate = timestamp;
    updated = true;
  }

  updateMicColour();
  if (updated) draw();
  rafId = requestAnimationFrame(mainLoop);
}

/*============== DRAW =================*/
function draw(){
  STRINGS.forEach((s, idx) => {
    const canvas = canvases[idx];
    if (!canvas || canvas.width === 0) return;

    const ctx = canvas.getContext('2d');
    const colW = canvas.width / DSP_CONFIG.COLS;
    const rowH = canvas.height / DSP_CONFIG.ROWS;

    ctx.fillStyle = '#222';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Guide lines
    const centreX = canvas.width/2;
    const leftX = centsToX(-10, canvas);
    const rightX = centsToX(10, canvas);

    ctx.strokeStyle = '#30d158';
    ctx.lineWidth = 2 * pixelRatio;
    ctx.beginPath();
    ctx.moveTo(centreX, 0);
    ctx.lineTo(centreX, canvas.height);
    ctx.stroke();

    ctx.strokeStyle = '#ff8800';
    ctx.lineWidth = pixelRatio;
    ctx.beginPath();
    ctx.moveTo(leftX, 0);
    ctx.lineTo(leftX, canvas.height);
    ctx.moveTo(rightX, 0);
    ctx.lineTo(rightX, canvas.height);
    ctx.stroke();

    // Waterfall
    histories[idx].forEach((entry, rowIdx) => {
      if (!entry) return;
      ctx.fillStyle = `hsl(${entry.hue},100%,${entry.light}%)`;
      ctx.globalAlpha = entry.alpha;
      ctx.fillRect(entry.col * colW, rowIdx * rowH, colW, rowH);
    });
    ctx.globalAlpha = 1;
  });
}

/*============== START =================*/
// No automatic start: the microphone and audio context need a user gesture.
// The observer above has already drawn the empty guides behind the start screen.
resizeCanvases();
</script>
</body>
</html>
